<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d785b">
  <title>To‘yona hisobi</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark">T</div>
      <div class="brand-copy"><h1>To‘yona hisobi</h1><p id="greeting">Hisob-kitoblaringiz bir joyda</p></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggleBtn" aria-label="Tungi rejim" title="Tungi rejim">🌙</button>
        <button class="icon-btn" id="refreshBtn" aria-label="Yangilash" title="Yangilash">↻</button>
      </div>
    </header>
    <div id="toast" class="toast" role="status"></div>
    <main id="app"><div class="loading"><span class="spinner"></span> Ma’lumotlar yuklanmoqda...</div></main>
    <nav class="bottom-nav">
      <button class="nav-item active" data-page="home"><span>⌂</span><small>Bosh sahifa</small></button>
      <button class="nav-item" data-page="weddings"><span>♧</span><small>To‘ylar</small></button>
      <button class="nav-item" data-page="friends"><span>♙</span><small>Oshnalar</small></button>
      <button class="nav-item" data-page="reports"><span>▤</span><small>Hisobot</small></button>
    </nav>
  </div>
  <dialog id="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Ma’lumot</h2>
      <button type="button" class="icon-btn" id="modalCloseBtn" aria-label="Yopish" title="Yopish">×</button>
    </div>
    <form id="modalForm">
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="modalCancelBtn">Bekor qilish</button>
        <button type="submit" class="btn primary" id="modalSave">Saqlash</button>
      </div>
    </form>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
