services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: toyona
      POSTGRES_USER: toyona
      POSTGRES_PASSWORD: toyona_local_password
    volumes:
      - toyona_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toyona -d toyona"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgres://toyona:toyona_local_password@db:5432/toyona
      DATABASE_SSL: "false"
      DEV_AUTH: "false"
    ports:
      - "3000:3000"
volumes:
  toyona_db:
